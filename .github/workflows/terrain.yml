name: Terrain runtime contract
on:
  push:
    paths: ['src/**', 'tests/test_terrain.py', 'tools/terrain_ci.py', '.github/workflows/terrain.yml', '.github/workflows/tests.yml']
  pull_request:
    paths: ['src/**', 'tests/test_terrain.py', 'tools/terrain_ci.py', '.github/workflows/terrain.yml', '.github/workflows/tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin upstream, compare baseline, build and approve disposable runtime
        run: python -X utf8 -B tools/terrain_ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-ubuntu-24.04-x86_64
          path: |
            verification/terrain-ci/*.log
            verification/terrain-ci/*.json
